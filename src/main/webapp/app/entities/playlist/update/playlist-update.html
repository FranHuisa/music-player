<div class="editor-header">
  <h2>
    @if (editForm.controls.id.value !== null) {
      Editar playlist
    } @else {
      Nueva playlist
    }
  </h2>

  <p>Crea y organiza tus playlists favoritas.</p>
</div>

<form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm" class="playlist-editor">
  <div class="playlist-editor-card">
    @if (editForm.controls.id.value !== null) {
      <div class="section">
        <h3>Identificador</h3>
        <div class="field">
          <label>ID</label>
          <input type="number" formControlName="id" readonly />
        </div>
      </div>
    }

    <div class="section">
      <div class="cover-wrapper">
        @if (coverPreviewUrl) {
          <img class="cover-img" [src]="coverPreviewUrl" />
        } @else {
          <div class="cover-placeholder">Sin portada</div>
        }
      </div>

      <div class="field">
        <label>Nombre</label>
        <input type="text" formControlName="name" />
      </div>

      <div class="field">
        <label>Descripción</label>
        <textarea formControlName="description"></textarea>
      </div>
      <div class="field">
        <label>Portada</label>

        <div class="file-upload-box">
          <button type="button" class="btn-upload" (click)="coverInput.click()">Seleccionar imagen</button>

          <span class="file-name">
            {{ selectedCover?.name ?? 'Ningún archivo seleccionado' }}
          </span>

          <input #coverInput type="file" hidden (change)="onCoverSelected($event)" accept="image/png,image/jpeg,image/webp" />
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="previousState()">Cancelar</button>

      <button type="submit" class="btn btn-primary" [disabled]="editForm.invalid || isSaving()">Guardar</button>
    </div>
  </div>
</form>
